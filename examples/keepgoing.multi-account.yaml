version: 1
loop:
  name: example-accounts
  state_dir: /fictional/state/keepgoing/example-accounts
  adapter: claude
  group: claude-account-a
  claude:
    workdir: /fictional/src/example-app
    model: sonnet
    env:
      CLAUDE_CONFIG_DIR: /fictional/accounts/claude-a
  prompt: Continue the work, honoring stop and pause first.
  fallbacks: fallbacks.multi-account.yaml
  switch_back:
    enabled: true
