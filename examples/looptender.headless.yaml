# yaml-language-server: $schema=../schema/looptender.schema.json
# keepgoing runs Claude Code headless itself, one turn at a time, resuming
# the same session. Useful on a server or in CI. Fictional values.
version: 1
loop:
  name: example-headless-loop
  state_dir: ~/.local/state/agent-loops/example-headless-loop
  adapter: claude
  claude:
    workdir: ~/src/example-app
    model: opus
    permission_mode: acceptEdits
    max_budget_usd: 5
  prompt: |
    Continue the authorized loop for the fictional Example App. Honor any
    newer stop or pause request first. Open pull requests for review; do not merge.
  progress:
    repositories: [~/src/example-app]
  fallbacks: fallbacks.yaml
