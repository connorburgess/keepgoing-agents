name: Checks

# Build and test jobs depend only on the commit, so they run for a new pull
# request, a push to it, or a reopen. They do not run on `edited`: editing a
# title or description changes no code, and re-running them there repeated
# about ten minutes of work on an unchanged commit. The one job that reads the
# title and body is in contributions.yml.
#
# `edited` also fires when a pull request's base branch is changed. That no
# longer starts these jobs by itself. Branch protection requires the branch to
# be up to date with its base, so merging the new base in pushes a commit and
# runs them; otherwise close and reopen the pull request.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

# A newer head supersedes an older run of this workflow. An edit to the pull
# request does not start this workflow, so it cannot cancel a run in progress.
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bb-plugin:
    name: BB plugin typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: integrations/bb-plugin-keepgoing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build CLI for plugin contract fixtures
        working-directory: .
        run: go build -o "$RUNNER_TEMP/keepgoing-plugin-test" ./cmd/keepgoing
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm test
        env:
          KEEPGOING_TEST_BINARY: ${{ runner.temp }}/keepgoing-plugin-test

  windows-acl:
    name: Windows access diagnostics
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./cmd/keepgoing
      - name: Verify registered client status and controls on Windows
        run: go test ./cmd/keepgoing -run '^TestClient' -count=1
      - name: Verify local loop registry on Windows
        run: go test ./internal/registry ./cmd/keepgoing -run '^TestRegistry' -count=1
      - run: go test -v ./cmd/keepgoing -run '^(TestWindowsACL|TestDoctorACL|TestWindowsAccess|TestDoctorAccess)' -count=1
      - name: Verify allowance persistence and replacement on Windows
        run: go test -v ./internal/state -run '^Test(SendLedger|ProgressLedger)' -count=1
      - name: Verify runtime records can be replaced while readers poll
        # Report every record even when an earlier step has already failed.
        if: always()
        run: go test -race -v ./internal/state ./internal/health ./internal/incident ./internal/report ./internal/registry ./internal/daemoninfo ./cmd/keepgoing -run '^(TestStateSnapshot|Test.*SnapshotSavesWhileReadersPoll$|TestTransferRecordReads)' -count=1
      - name: Verify BB transfer and recovery on Windows
        run: go test -v ./cmd/keepgoing -run '^TestTransfer' -count=1
      - run: go test -v ./internal/config -run '^TestBBTransfer' -count=1
      - name: Verify goal-aware setup on Windows
        run: go test -v ./cmd/keepgoing -run '^TestInitGoal' -count=1
      - name: Verify Cursor guided setup on Windows
        run: go test -v ./cmd/keepgoing -run '^(TestInitCursor|TestDoctorCursor)' -count=1
      - name: Verify guided fallback setup on Windows
        run: go test -v ./cmd/keepgoing -run '^TestFallbacks(Add|Handoff|Remove|Move|Manage)' -count=1
      - name: Verify private goal records on Windows
        run: go test -v ./internal/control -run '^TestGoal' -count=1
      - name: Verify control writes across repeated and backwards clock readings
        run: go test -v ./internal/control -run '^TestSaveAdvancesLoadedTimestamp$' -count=1
      - name: Verify native headless runner lifecycle and owned cancellation
        run: go test -race -v ./internal/adapter/runner -count=1
      - name: Verify Cursor command recovery and active holds on Windows
        run: go test -race -v ./cmd/keepgoing -run '^TestCursorCommand' -count=1
      - name: Verify Cursor idle holds through the real factory on Windows
        run: go test -race -v ./internal/supervise -run '^TestCursorHolds' -count=1
      - name: Verify daemon control polling with unchanged file metadata
        run: go test -v ./cmd/keepgoing -run '^TestDaemonWait' -count=1
      - name: Verify control snapshots permit atomic replacement on Windows
        run: go test -race -v ./internal/control ./internal/snapshot ./cmd/keepgoing -run '^(TestControlSnapshot|TestWindowsControlSnapshot|TestDaemonWaitSnapshot)' -count=1
      - name: Verify the run reference graph store and replacement on Windows
        run: go test -race -v ./internal/rungraph -count=1
      - name: Verify offline run navigation on Windows
        run: go test -race -v ./cmd/keepgoing -run '^TestRuns' -count=1
      - name: Verify detached background startup with a local process fixture
        run: go test -v ./cmd/keepgoing -run '^TestStartBackgroundProcess$' -count=20 -timeout=3m

  go:
    name: Build and test
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go build ./...
      - name: Check third-party notices match the executable's modules
        run: scripts/third-party-notices.sh --check
      - run: go test -race ./...
      - name: Smoke check setup and recovery with local fixtures
        run: |
          go build -trimpath -ldflags "-X main.version=smoke-${GITHUB_SHA}" -o "$RUNNER_TEMP/keepgoing-smoke" ./cmd/keepgoing
          python3 scripts/smoke-release.py "$RUNNER_TEMP/keepgoing-smoke"
          python3 -u scripts/smoke-recovery.py "$RUNNER_TEMP/keepgoing-smoke" --include-cursor
      - name: Build and test the optional macOS menu preview
        if: runner.os == 'macOS'
        run: |
          swift build --package-path integrations/macos
          swift test --package-path integrations/macos
          python3 integrations/macos/scripts/smoke-contract.py "$RUNNER_TEMP/keepgoing-smoke"
      - name: Verify native Linux ACL metadata fixture
        if: runner.os == 'Linux'
        run: go test -v ./cmd/keepgoing -run '^TestLinuxACLMetadataDetectsDefaultACLHiddenByModeBits$' -count=1
      - name: Cross-compile for Windows
        if: runner.os == 'Linux'
        run: GOOS=windows GOARCH=amd64 go build -o /dev/null ./cmd/keepgoing
