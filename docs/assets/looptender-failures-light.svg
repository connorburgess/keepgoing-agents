<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">What looptender does when something goes wrong</title><desc id="d">A table with one row per case. Limit reached: moves to the next route you configured, or waits for the reset. Connection lost: waits, then resumes on the first check after it returns. Turn failed: retries or re-prompts, within a cap. No progress: nudges within a cap, then holds. Needs a person: holds and shows it in status and the panel.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#B9802A"/></marker></defs><rect width="100%" height="100%" fill="#F4F1E6"/><text x="40" y="44" font-size="15" font-weight="600" fill="#3E5A63">When this happens</text><text x="350" y="44" font-size="15" font-weight="600" fill="#3E5A63">looptender</text><rect x="30" y="64" width="260" height="54" rx="12" fill="#FFFFFF" stroke="#13303B" stroke-width="1.6"/><text x="160" y="98" text-anchor="middle" font-size="18" font-weight="600" fill="#13303B">Limit reached</text><line x1="296" y1="91" x2="336" y2="91" stroke="#B9802A" stroke-width="1.8" marker-end="url(#a)"/><rect x="340" y="64" width="590" height="54" rx="12" fill="#A3BBA8" fill-opacity="0.22" stroke="#B9802A" stroke-width="1.6" stroke-dasharray="7 6"/><text x="362" y="97" font-size="16" fill="#13303B">moves to the next route you configured, or waits for the reset</text><rect x="30" y="132" width="260" height="54" rx="12" fill="#FFFFFF" stroke="#13303B" stroke-width="1.6"/><text x="160" y="166" text-anchor="middle" font-size="18" font-weight="600" fill="#13303B">Connection lost</text><line x1="296" y1="159" x2="336" y2="159" stroke="#B9802A" stroke-width="1.8" marker-end="url(#a)"/><rect x="340" y="132" width="590" height="54" rx="12" fill="#A3BBA8" fill-opacity="0.22" stroke="#B9802A" stroke-width="1.6" stroke-dasharray="7 6"/><text x="362" y="165" font-size="16" fill="#13303B">waits, then resumes on the first check after it returns</text><rect x="30" y="200" width="260" height="54" rx="12" fill="#FFFFFF" stroke="#13303B" stroke-width="1.6"/><text x="160" y="234" text-anchor="middle" font-size="18" font-weight="600" fill="#13303B">Turn failed</text><line x1="296" y1="227" x2="336" y2="227" stroke="#B9802A" stroke-width="1.8" marker-end="url(#a)"/><rect x="340" y="200" width="590" height="54" rx="12" fill="#A3BBA8" fill-opacity="0.22" stroke="#B9802A" stroke-width="1.6" stroke-dasharray="7 6"/><text x="362" y="233" font-size="16" fill="#13303B">retries or re-prompts, within a cap</text><rect x="30" y="268" width="260" height="54" rx="12" fill="#FFFFFF" stroke="#13303B" stroke-width="1.6"/><text x="160" y="302" text-anchor="middle" font-size="18" font-weight="600" fill="#13303B">No progress</text><line x1="296" y1="295" x2="336" y2="295" stroke="#B9802A" stroke-width="1.8" marker-end="url(#a)"/><rect x="340" y="268" width="590" height="54" rx="12" fill="#A3BBA8" fill-opacity="0.22" stroke="#B9802A" stroke-width="1.6" stroke-dasharray="7 6"/><text x="362" y="301" font-size="16" fill="#13303B">nudges within a cap, then holds</text><rect x="30" y="336" width="260" height="54" rx="12" fill="#FFFFFF" stroke="#13303B" stroke-width="1.6"/><text x="160" y="370" text-anchor="middle" font-size="18" font-weight="600" fill="#13303B">Needs a person</text><line x1="296" y1="363" x2="336" y2="363" stroke="#B9802A" stroke-width="1.8" marker-end="url(#a)"/><rect x="340" y="336" width="590" height="54" rx="12" fill="#A3BBA8" fill-opacity="0.22" stroke="#B9802A" stroke-width="1.6" stroke-dasharray="7 6"/><text x="362" y="369" font-size="16" fill="#13303B">holds and shows it in status and the panel</text><text x="480" y="438" text-anchor="middle" font-size="16" fill="#3E5A63">When the right move is not clear, looptender holds and asks you.</text></svg>
