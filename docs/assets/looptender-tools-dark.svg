<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">looptender runs beside your agent tools</title><desc id="d">One machine, drawn as a large frame. Inside it, four agent tools sit side by side, each with its own session: an agent host such as BB with a BB thread; a headless Claude Code or Codex session; a Cursor CLI session; and any other agent described by its status and resume commands. Below them, one looptender box on the same machine has dashed lines to each session, labelled watch, wake, bound, hold. Caption: the session stays where it lives.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#E5AE53"/></marker></defs><rect width="100%" height="100%" fill="#0B191E"/><rect x="20" y="20" width="920" height="400" rx="20" fill="none" stroke="#A3BBA8" stroke-opacity="0.5" stroke-width="1.4"/><text x="44" y="50" font-size="15" font-weight="600" fill="#C9D6CC">Your machine</text><rect x="48" y="72" width="198" height="96" rx="12" fill="#13303B" stroke="#A3BBA8" stroke-width="1.6"/><text x="147.0" y="116.0" text-anchor="middle" font-size="19" font-weight="600" fill="#F4F1E6">Agent host</text><text x="147.0" y="138.0" text-anchor="middle" font-size="14" fill="#C9D6CC">BB</text><rect x="82" y="184" width="130" height="34" rx="17" fill="#A3BBA8" fill-opacity="0.10" stroke="#A3BBA8" stroke-width="1.2"/><text x="147" y="206" text-anchor="middle" font-size="14" fill="#F4F1E6">BB thread</text><line x1="480" y1="306" x2="147" y2="222" stroke="#E5AE53" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#a)"/><rect x="270" y="72" width="198" height="96" rx="12" fill="#13303B" stroke="#A3BBA8" stroke-width="1.6"/><text x="369.0" y="116.0" text-anchor="middle" font-size="19" font-weight="600" fill="#F4F1E6">Headless CLI</text><text x="369.0" y="138.0" text-anchor="middle" font-size="14" fill="#C9D6CC">Claude Code, Codex</text><rect x="304" y="184" width="130" height="34" rx="17" fill="#A3BBA8" fill-opacity="0.10" stroke="#A3BBA8" stroke-width="1.2"/><text x="369" y="206" text-anchor="middle" font-size="14" fill="#F4F1E6">saved session</text><line x1="480" y1="306" x2="369" y2="222" stroke="#E5AE53" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#a)"/><rect x="492" y="72" width="198" height="96" rx="12" fill="#13303B" stroke="#A3BBA8" stroke-width="1.6"/><text x="591.0" y="116.0" text-anchor="middle" font-size="19" font-weight="600" fill="#F4F1E6">Cursor CLI</text><text x="591.0" y="138.0" text-anchor="middle" font-size="14" fill="#C9D6CC">primary route only</text><rect x="526" y="184" width="130" height="34" rx="17" fill="#A3BBA8" fill-opacity="0.10" stroke="#A3BBA8" stroke-width="1.2"/><text x="591" y="206" text-anchor="middle" font-size="14" fill="#F4F1E6">saved session</text><line x1="480" y1="306" x2="591" y2="222" stroke="#E5AE53" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#a)"/><rect x="714" y="72" width="198" height="96" rx="12" fill="#13303B" stroke="#A3BBA8" stroke-width="1.6"/><text x="813.0" y="116.0" text-anchor="middle" font-size="19" font-weight="600" fill="#F4F1E6">Your own agent</text><text x="813.0" y="138.0" text-anchor="middle" font-size="14" fill="#C9D6CC">status and resume</text><rect x="748" y="184" width="130" height="34" rx="17" fill="#A3BBA8" fill-opacity="0.10" stroke="#A3BBA8" stroke-width="1.2"/><text x="813" y="206" text-anchor="middle" font-size="14" fill="#F4F1E6">its session</text><line x1="480" y1="306" x2="813" y2="222" stroke="#E5AE53" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#a)"/><rect x="330" y="306" width="300" height="84" rx="14" fill="#13303B" stroke="#E5AE53" stroke-width="2.2"/><text x="480" y="340" text-anchor="middle" font-size="21" font-weight="700" fill="#E5AE53">looptender</text><text x="480" y="366" text-anchor="middle" font-size="15" fill="#F4F1E6">watch · wake · bound · hold</text><text x="480" y="466" text-anchor="middle" font-size="16" fill="#C9D6CC">The session stays where it lives. looptender watches it from beside the tool, on the same machine.</text></svg>
