<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">How looptender fits: you, a coordinator, and its lanes</title><desc id="d">You, at the top, set goals and give approvals to a coordinator session, which plans, assigns and reviews work. A dashed ring labelled looptender surrounds the coordinator: looptender wakes it, bounds it, recovers it, and holds for you when needed. Below, the coordinator delegates to three lanes, which sit outside the ring.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#A3BBA8"/></marker></defs><rect width="100%" height="100%" fill="#0B191E"/><rect x="240" y="24" width="240" height="72" rx="12" fill="#13303B" stroke="#A3BBA8" stroke-width="1.6"/><text x="360.0" y="56.0" text-anchor="middle" font-size="22" font-weight="600" fill="#F4F1E6">You</text><text x="360.0" y="80.0" text-anchor="middle" font-size="15" fill="#C9D6CC">goals and approvals</text><line x1="360" y1="96" x2="360" y2="184" stroke="#A3BBA8" stroke-width="1.6" marker-end="url(#a)"/><rect x="190" y="130" width="600" height="200" rx="28" fill="#A3BBA8" fill-opacity="0.10" stroke="#E5AE53" stroke-width="2.2" stroke-dasharray="9 7"/><text x="214" y="160" font-size="17" font-weight="700" fill="#E5AE53">looptender</text><rect x="235" y="186" width="250" height="84" rx="12" fill="#13303B" stroke="#A3BBA8" stroke-width="1.6"/><text x="360.0" y="224.0" text-anchor="middle" font-size="22" font-weight="600" fill="#F4F1E6">Coordinator</text><text x="360.0" y="248.0" text-anchor="middle" font-size="15" fill="#C9D6CC">plans, assigns, reviews</text><circle cx="540" cy="191" r="3.5" fill="#E5AE53"/><text x="554" y="196" font-size="16" fill="#F4F1E6">wakes it</text><circle cx="540" cy="217" r="3.5" fill="#E5AE53"/><text x="554" y="222" font-size="16" fill="#F4F1E6">bounds it</text><circle cx="540" cy="243" r="3.5" fill="#E5AE53"/><text x="554" y="248" font-size="16" fill="#F4F1E6">recovers it</text><circle cx="540" cy="269" r="3.5" fill="#E5AE53"/><text x="554" y="274" font-size="16" fill="#F4F1E6">holds for you when needed</text><line x1="360" y1="270" x2="230" y2="394" stroke="#A3BBA8" stroke-width="1.6" marker-end="url(#a)"/><rect x="135" y="396" width="190" height="60" rx="12" fill="#13303B" stroke="#A3BBA8" stroke-width="1.6"/><text x="230.0" y="433.0" text-anchor="middle" font-size="20" font-weight="600" fill="#F4F1E6">Lane</text><line x1="360" y1="270" x2="480" y2="394" stroke="#A3BBA8" stroke-width="1.6" marker-end="url(#a)"/><rect x="385" y="396" width="190" height="60" rx="12" fill="#13303B" stroke="#A3BBA8" stroke-width="1.6"/><text x="480.0" y="433.0" text-anchor="middle" font-size="20" font-weight="600" fill="#F4F1E6">Lane</text><line x1="360" y1="270" x2="730" y2="394" stroke="#A3BBA8" stroke-width="1.6" marker-end="url(#a)"/><rect x="635" y="396" width="190" height="60" rx="12" fill="#13303B" stroke="#A3BBA8" stroke-width="1.6"/><text x="730.0" y="433.0" text-anchor="middle" font-size="20" font-weight="600" fill="#F4F1E6">Lane</text><text x="480" y="508" text-anchor="middle" font-size="16" fill="#C9D6CC">looptender supervises the coordinator. The coordinator runs its own lanes.</text></svg>
